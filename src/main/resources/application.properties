spring.application.name=payment-service
server.port=${SERVER_PORT:8080}

# No datasource is configured here on purpose: activate the `dev` profile for
# local defaults, or `prod` and supply DB_URL / DB_USERNAME / DB_PASSWORD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Bearer-token validation. Issuer and audience have non-secret defaults; the
# signing key must come from the environment (see docs/SECURITY.md).
payflow.security.jwt.issuer=${PAYFLOW_JWT_ISSUER:payflow-local}
payflow.security.jwt.audience=${PAYFLOW_JWT_AUDIENCE:payflow-api}
payflow.security.jwt.jwk-set-uri=${PAYFLOW_JWT_JWK_SET_URI:}
payflow.security.jwt.hmac-secret=${PAYFLOW_JWT_SECRET:}


# Events are relayed from the transactional outbox. Until a broker integration
# is configured, the relay logs event metadata instead of delivering it.
payflow.kafka.enabled=false
