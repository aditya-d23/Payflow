spring.application.name=payment-service
server.port=${SERVER_PORT:8080}

# No datasource is configured here on purpose: activate the `dev` profile for
# local defaults, or `prod` and supply DB_URL / DB_USERNAME / DB_PASSWORD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Bearer-token validation. Issuer and audience have non-secret defaults; the
# signing key must come from the environment (see docs/SECURITY.md).
payflow.security.jwt.issuer=${PAYFLOW_JWT_ISSUER:payflow-local}
payflow.security.jwt.audience=${PAYFLOW_JWT_AUDIENCE:payflow-api}
payflow.security.jwt.jwk-set-uri=${PAYFLOW_JWT_JWK_SET_URI:}
payflow.security.jwt.hmac-secret=${PAYFLOW_JWT_SECRET:}

# Events. Without Kafka the relay logs event metadata instead of delivering it,
# so the transactional outbox still works for local development.
payflow.kafka.enabled=${PAYFLOW_KAFKA_ENABLED:false}
payflow.kafka.create-topics=${PAYFLOW_KAFKA_CREATE_TOPICS:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.isolation.level=read_committed
# Kafka auto-configuration is inert unless payflow.kafka.enabled is true; do not
# start listener containers against a broker that is not configured.
spring.kafka.listener.auto-startup=${payflow.kafka.enabled}
