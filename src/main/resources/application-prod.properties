# Production: every credential must come from the environment. There are no
# fallbacks, so a missing variable fails startup instead of connecting somewhere
# unexpected.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# Production must verify tokens against the identity provider's public keys.
payflow.security.jwt.issuer=${PAYFLOW_JWT_ISSUER}
payflow.security.jwt.audience=${PAYFLOW_JWT_AUDIENCE}
payflow.security.jwt.jwk-set-uri=${PAYFLOW_JWT_JWK_SET_URI}
payflow.security.jwt.hmac-secret=
